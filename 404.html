<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>الصفحة غير موجودة — تمور السلطان | Alsultan Dates</title>
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B0805" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@300;400;500&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg0:#0B0805; --ivory:#F3E9D6; --ivory-soft:#C9B99F; --ivory-faint:#8F8069;
    --gold:#C89044; --gold-deep:#9A6B2B; --gold-bright:#E2B264;
    --line:rgba(226,178,100,.18); --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg0);color:var(--ivory);font-family:"Tajawal",system-ui,sans-serif;
    font-weight:300;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:8vh 20px}
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 0%,rgba(226,178,100,.15),rgba(20,13,6,0) 62%)}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(135% 120% at 50% 42%,transparent 52%,rgba(0,0,0,.5) 100%)}
  .wrap{position:relative;z-index:1;max-width:640px}
  .code{font-family:"Cormorant Garamond",serif;font-size:clamp(78px,17vw,168px);font-weight:600;
    line-height:.9;letter-spacing:.04em;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:"El Messiri",serif;font-weight:600;font-size:clamp(24px,4.6vw,38px);
    line-height:1.3;margin-top:18px;color:var(--ivory)}
  .en{font-family:"Cormorant Garamond",serif;font-size:clamp(15px,2vw,19px);letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold);margin-top:14px}
  p{color:var(--ivory-soft);font-size:clamp(15px,1.9vw,17px);margin-top:20px;max-width:46ch;
    margin-inline:auto}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:38px}
  .btn{display:inline-block;padding:14px 32px;border-radius:999px;text-decoration:none;
    font-size:15px;font-weight:500;transition:background .35s var(--ease),color .35s,border-color .35s}
  .btn-primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#140D06}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{border:1px solid var(--line);color:var(--gold-bright)}
  .btn-ghost:hover{border-color:var(--gold)}
  .cr{margin-top:44px;color:var(--ivory-faint);font-size:12.5px}
  .cr a{color:var(--ivory-faint)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div class="glow"></div><div class="vignette"></div>
<main class="wrap">
  <div class="code">٤٠٤</div>
  <h1>هذه الصفحة غير موجودة</h1>
  <div class="en">Page not found</div>
  <p>الرابط الذي وصلت منه قديمٌ أو غير صحيح. عُد إلى الصفحة الرئيسية، أو اطلب عرض سعر مباشرةً.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">الصفحة الرئيسية</a>
    <a class="btn btn-ghost" href="/quote">اطلب عرض سعر</a>
    <a class="btn btn-ghost" href="/en">English</a>
  </div>
  <div class="cr">تمور السلطان — Alsultan Dates · كربلاء، العراق · <a href="mailto:info@alsultan-dates.com">info@alsultan-dates.com</a></div>
</main>
</body>
</html>
